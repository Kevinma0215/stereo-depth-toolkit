name: cv
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # OpenCV 5 moved the fisheye CALIB_* constants out of cv2.fisheye and changed
  # stereoRectify's argument handling; both the stereo and mono pipelines break
  # on it. Keep this pinned until the codebase is ported.
  - opencv>=4.10,<5
  - scipy
  - numpy
  - pyyaml
  - pip
  - pip:
      - pytest
      - typer[all]
