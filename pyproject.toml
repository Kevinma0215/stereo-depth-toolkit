[project]
name = "stereo-depth-toolkit"
version = "0.1.0"
dependencies = [
  "numpy",
  "opencv-python",
  "typer>=0.12",
  "pyyaml",
]

[project.scripts]
stereo-depth = "stereo_depth.cli.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
